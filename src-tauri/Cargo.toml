[package]
name = "narratorverse"
version = "0.2.0-beta.1"
description = "Local subtitle narrator for Linux"
edition = "2021"
license = "MIT"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by Tauri; set an explicit theme icon for Wayland/KDE too.
gtk = "0.18.2"